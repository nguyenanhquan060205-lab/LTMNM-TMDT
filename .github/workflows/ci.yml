name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop

jobs:
  gate-0:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: techsecond_test
          MYSQL_USER: techsecond_app
          MYSQL_PASSWORD: password
          MYSQL_ROOT_PASSWORD: root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      APP_ENV: testing
      APP_DEBUG: true
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: techsecond_test
      DB_USERNAME: techsecond_app
      DB_PASSWORD: password
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, fileinfo, mbstring, openssl, pdo, pdo_mysql, xml, curl
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Validate Composer
        run: composer validate --strict

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Check platform requirements
        run: composer check-platform-reqs

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      - name: Run migrations and seeders
        run: php artisan migrate:fresh --seed --ansi

      - name: Pint
        run: vendor/bin/pint --test

      - name: Quality scanner
        run: composer run check:quality

      - name: PHPUnit
        run: php artisan test

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
